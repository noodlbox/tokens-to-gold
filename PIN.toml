[recert.release]
# PROPOSED re-cert release (R16). Owner: the DO cuts it on the FINAL harness
# sha after push, so the tag pins the exact harness commit the attachments
# belong to. The fork stages + pins; it does NOT upload.
# Proposed harness version bump: v1-2.3.18 (MAJOR) — the re-cert is a breaking
# methodology change vs v1.0.0-rc1: LOCKED_METRICS changed (reach_at_80 split
# into whole_list + within_32k), ArmMetrics reshaped, the 4-language arm table
# + native_floor span scorer + derived-provenance gate + explicit-mode privacy
# resolver are all new; the report/metric surface is not V1-compatible.
proposed_tag = "v1-2.3.18"
staged_dir = "runs/recert-2026-09/R16-staging"
# Carries the 16 payload files — the 12 arm reports + the 4 frozen-gold files —
# plus SHA256SUMS + MANIFEST.json (each file, its sha, its certified source
# path). NO binary ships: the measuring binary is dropped (see [recert.binary]),
# because a binary file digest is not a reproduction target (BUNDLE.md
# publication contract, row 13). No binary is published at all — the engine is an
# internal tool for this re-certification (see the released-binary section); the
# 16 payload files are the reproduction surface.

[gold]
# Small enough to ship in the repo; digests also in gold/SHA256SUMS.
# go34/rust43 join at the 2026-09 re-cert (A4): go34 from run8 (adjudicated),
# rust43 from the lease-1 certified derivation — each sha-verified against the
# bytes the certification consumed before pinning.
frozen_gold_go34 = "bf8de741a03597d5db62b5c0dceee901799a12188fbae6b9253e9b094d422a8e"
frozen_gold_py_nosphinx = "05033580302881b919729bdbd9b485c2b89e0531bd338f3e19acedbcebe67736"
frozen_gold_rust43 = "7b45f6abbd8f3700fabfac37c292a91e523fae940588b44fb6565768fcb239fe"
frozen_gold_ts40 = "fcc09bd98d5e648be1c46803b72140b233599ef91e2dd945ba4b52e72d02a0e3"

[provenance]
gold_derived_at_commit = "0c061c57"
sweep_binary_base_commit = "6d3ccaf0"
# The acceptance record additionally pins the measured main SHA (3a3f01fd)
# and the binary digest above; the retrieval policy is byte-identical from
# 3a3f01fd through the released nbx v2.1.0 tag (rename-only diff, verified
# 2026-08-26) — see the page's release-version provenance note.
measured_main_sha = "3a3f01fdc69b0e100dde126b9dc6886bd1056d2f"
policy_identical_through = "nbx v2.1.0"

# ---------------------------------------------------------------------------
# 2026-09 RE-CERTIFICATION (A4). Prepared BEFORE the lease run so the re-pin is
# a fill-in, not a rewrite. The eval-binary identity fields below are explicit
# PENDING-RUN sentinels: `ttg.pins.validate_recert` REFUSES them, so the
# harness cannot accept a half-filled re-cert pin — and a blank is refused the
# same way, because a silently-empty identity is the failure this prevents.
# ---------------------------------------------------------------------------

[recert]
status = "measured"
target_release = "v2.3.18"
# The pre-registration witness: no derive/arm number predates this commit.
preregistration_commit = "03356635876cc510cb48a7c3b94579f7dd445aec"

[recert.cli_artifact]
# The SHIPPED CLI the certification describes, for cross-reference. Verified by
# rel2-t2g 2026-09-05. This is a published artifact, so its sha IS pinnable —
# unlike the eval binary, whose file sha is identity, never a repro target.
url = "https://install.noodlbox.io/releases/v2.3.18/macos-arm64/nbx.tar.gz"
sha256 = "3c24c4124e173aa28229340b1293b4356de65310ad648743c146f136da4151bf"

[recert.binary]
# The MEASUREMENT binary — the exact noodl-eval every re-cert number was scored
# with, MEASURED-WITH but NOT PUBLISHED. It is dropped from the R16 attachments
# and is never a fetch target: a binary file digest is not a reproduction target
# (the build path bakes into it — BUNDLE.md publication contract, row 13), and
# the binary once embedded the held-out corpus name in SQL-comment strings, so
# it does not ship. Its identity is pinned here so a third party can cross-check
# the numbers' producer. It is not published, and neither is any other build of
# the engine — the released-binary section below records that as a declared state
# with its reason, not as a pending step.
#
# Filled from the certified lease artifacts by READING them (A4 step 8), never
# typed: build_commit + eval_features from each lease's provenance_header.txt,
# sha256 from bin/noodl-eval.sha256 AND recomputed from the actual carried
# binary — every source identical across both leases (cross-lease "one binary"
# assertion). Verified 2026-09-07. report.py's _cross_lease_binary_sha reads
# THIS section (not released_binary) — the "one binary, every cell" claim is
# about the binary the cells were measured with.
eval_features = "rust-analysis"
build_commit = "cece1486222fe100dce0d3ec34aba9b7899e484f"
sha256 = "bf920e4a765b0fa5a403ee95ddfbb3d3a66449d07d2286da2bce878520e30783"

[recert.released_binary]
# NOT PUBLISHED — a decision, not a wait.
#
# The founder ruled the `noodl-eval` engine is an INTERNAL tool: no build of it is
# published, so there is no release identity to name here and there will not be
# one for this re-certification. The earlier PENDING-RELEASE sentinel said "not
# yet", which is a different and now-wrong claim.
#
# The absence is EXPLAINED, never silent (BUNDLE.md publication contract): the
# certified numbers are verifiable offline WITHOUT the binary, against the 16
# sha-pinned release assets — the 12 arm reports and the 4 frozen-gold files —
# through the harness's own scorer and `ttg.curve_recompute`. What the binary
# would add is a re-RUN, not a verification, and a binary file digest was never a
# reproduction target anyway (the build path bakes into it).
#
# `ttg validate-pins --flip` accepts this state only while `reason` is non-blank:
# a bare `state` is refused exactly like a blank field, because an UNEXPLAINED
# absence is the thing the contract forbids. `state` is a distinct marker from
# both PENDING-RUN (measurement) and PENDING-RELEASE (publication pending), so
# filling one can never silently satisfy another.
state = "not-published"
reason = "the re-certification engine is an internal tool and is not published; the certified numbers verify offline against the 16 sha-pinned release assets, measured with bf920e4a765b0fa5a403ee95ddfbb3d3a66449d07d2286da2bce878520e30783 at cece1486222fe100dce0d3ec34aba9b7899e484f."

[recert.corpora]
# go34/rust43 join ts40/py_nosphinx at the re-cert. N and exclusions are the
# pre-registered "confirmed on derive" values; the manifests are the public
# checkout-set proof emitted by `ttg.cli provision`.
go34 = "3f221ceed33cd0b34cf1f71acc47e51424090b36aae62be2f2e5b89e90d2b54d"
rust43 = "32661b0c77aff0e5cdbad9e82c21be6a0ef493a7945a0923174629fc8f36ce03"
