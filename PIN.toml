# Artifact pins.
#
# STATUS: the harness location, the released-binary attachment, and the
# durable artifact home are ALL WIRED (GitHub release assets on this repo,
# ruled acceptable as the "release attachment" home). The one remaining
# marker is the PUBLIC FLIP itself.
#
# G3 is SIGNED (founder, 2026-08-20): page copy and claims are approved, and
# the public flip is AUTHORIZED for the coordinated go-live. Flipping the
# repo public is the coordinated go-live step — it makes every URL below
# resolve for a logged-out reader at once (release assets ride the repo's
# visibility).
#
# Nothing here may be cited as a PUBLIC location while the repo is private:
# the URLs below resolve only for authenticated collaborators until the flip.

[repo]
# WIRED: the harness lives here. The public flip rides the coordinated
# go-live (founder-authorized at the G3 sign-off).
name = "noodlbox/tokens-to-gold"
# READY-TO-FLIP: the ONE pending pin — the coordinated go-live step sets this
# to "public"; every URL in this file then resolves for a logged-out reader.
visibility = "private"
clone_url = "https://github.com/noodlbox/tokens-to-gold.git"
# At go-live this becomes the same URL with the repo public; recorded now so
# the flip changes VISIBILITY, never a location.
public_url = "https://github.com/noodlbox/tokens-to-gold"

[binary]
# The V1 measurement binary — the EXACT noodl-eval the V1 acceptance numbers
# were measured with (main @ 3a3f01fd). IDENTITY ONLY, not a fetch target:
# `artifact_targets` no longer pulls it, because a binary file digest is not a
# reproduction target (OUT_DIR bakes in the absolute build path — see README;
# BUNDLE.md publication contract, row 13). Kept so the V1 numbers' producer is
# cross-checkable, exactly as [recert.binary] is for the re-cert.
release_tag = "v1.0.0-rc1"
asset_name = "noodl-eval-official"
sha256 = "c5dbaf91d0502b1c792834d3c3f19e520e68eff50088fab8b1a2f731f04e7c65"
url = "https://github.com/noodlbox/tokens-to-gold/releases/download/v1.0.0-rc1/noodl-eval-official"

[artifacts]
# Large derivation reports live as release attachments on this repo (the
# founder-ruled alternative to R2: sha-pinned, README-pinned, not in git).
store = "github-release"
release_tag = "v1.0.0-rc1"

