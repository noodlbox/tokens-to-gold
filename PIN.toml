# Artifact pins.
#
# STATUS: the harness LOCATION is wired (private repo, below). The durable
# artifact home (R2) and the released-binary attachment are NOT wired yet.
#
# G3 is SIGNED (founder, 2026-08-20): page copy and claims are approved, and
# the public flip is AUTHORIZED for the coordinated go-live once B8 and
# packaging land. So the remaining markers are READY-TO-FLIP, not blocked —
# but flipping them is the design owner's coordinated step, not a side effect
# of a packaging commit.
#
# Nothing here may be cited as a PUBLIC location while a READY-TO-FLIP
# remains: the repo is still private and the URLs do not resolve yet.

[repo]
# WIRED: the harness lives here. This is the HARNESS LOCATION, not a public
# URL — the repo is private and the public flip rides the founder G3 sign-off.
name = "noodlbox/tokens-to-gold"
visibility = "private"
clone_url = "https://github.com/noodlbox/tokens-to-gold.git"
# G3 SIGNED — authorized to flip at the coordinated go-live (B8 + packaging).
public_url = "<READY-TO-FLIP-AT-GO-LIVE>"

[binary]
# The released noodl-eval a third party runs. Identity is pinned by digest;
# the SHA of the binary FILE is not a reproduction target (OUT_DIR bakes in
# the absolute build path) — see README.
release_tag = "<READY-TO-FLIP-RELEASE-WIRING>"
asset_name = "<READY-TO-FLIP-RELEASE-WIRING>"
sha256 = "<READY-TO-FLIP-RELEASE-WIRING>"

[artifacts]
# Large derivation reports live in object storage, not in the repo.
store = "r2"
bucket = "<READY-TO-FLIP-R2>"
prefix = "<READY-TO-FLIP-R2>"

